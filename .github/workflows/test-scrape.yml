name: Cloudflare download feasibility test

# Manual trigger only — this is a one-off experiment, not the real daily job yet.
on:
  workflow_dispatch:

jobs:
  scrape-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium (with OS deps)
        run: npx playwright install --with-deps chromium

      - name: Run scrape test (under virtual display)
        # headless:false needs a display; xvfb-run provides a virtual one on the CI server.
        run: xvfb-run --auto-servernum node scrape-test.js

      - name: Upload artifacts (screenshot, html, candidates, any download)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-artifacts
          path: artifacts/
          if-no-files-found: warn
